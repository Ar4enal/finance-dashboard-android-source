# .github/workflows/android-build.yml
name: Build Android APK

# 1. 触发条件：当代码推送到 main 或 master 分支时触发
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    # 2. 运行环境：使用 GitHub 提供的 Ubuntu 虚拟机
    runs-on: ubuntu-latest

    steps:
    # 3. 步骤1：拉取你的代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 4. 步骤2：设置 Java 环境 (Android 构建需要)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 5. 步骤3：给 gradlew 脚本添加执行权限
    - name: Make gradlew executable
      run: chmod +x gradlew

    # 6. 步骤4：执行 Gradle 构建命令，生成 Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 7. 步骤5：将生成的 APK 文件上传为“构建产物”，方便你下载
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
